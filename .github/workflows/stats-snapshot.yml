name: Stats snapshot

# Saves the anonymous play stats into the repo once a day (and on demand from the Actions tab),
# so they can be read straight from stats/latest.txt without pasting anything.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the stats
        run: node tools/stats-snapshot.js
      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/latest.json stats/latest.txt stats/history
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Stats snapshot $(date -u +%F)"
            git pull --rebase
            git push
          fi
